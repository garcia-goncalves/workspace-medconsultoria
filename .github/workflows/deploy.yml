name: Deploy

# Publicar NÃO é automático. O gatilho é o botão "Run workflow" na aba Actions — nunca
# `on: push`. Quem aperta é o dono, ou eu depois do "pode subir" dele (§0.9 do CLAUDE.md
# global, decisão de 17/08/2026).
#
# POR QUE O DEPLOY MUDOU DE LUGAR: até 12/08/2026 isto era `./deploy.sh` rodando no laptop
# do dono. Duas coisas quebravam: (a) a chave SSH precisava morar no disco dele, e (b) o
# classificador do harness barrava o comando de forma imprevisível — em 17/08/2026 ele
# barrou uma publicação de correção já pronta e testada. Aqui a chave mora em GitHub
# Secrets, o runner tem permissão para tudo, e o deploy virou arquivo revisável.
#
# O `deploy.sh` continua no repositório: é a MESMA sequência, e serve de documentação e de
# saída de emergência se o GitHub estiver fora do ar.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Digite PUBLICAR (em maiúsculas) para confirmar"
        required: true
        type: string

# ⛔ A ARMADILHA MAIS CARA DESTE PROJETO, resolvida de graça aqui.
# Dois `./deploy.sh` ao mesmo tempo se sabotam: disputam o mesmo /tmp/boot-teste.log, a
# mesma porta do `node app.cjs` e os mesmos node_modules do `prisma generate` — e o sintoma
# (ensaio de boot com 0 e lista de erros VAZIA) parece defeito do código. Acontecia porque
# o deploy passa de 2 minutos, parece travado, e o comando era colado de novo.
# Com `concurrency`, a segunda execução ESPERA a primeira terminar. Não há como colidir.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirmar == 'PUBLICAR'
    runs-on: ubuntu-latest
    environment: producao
    env:
      DEPLOY_PATH: /home3/medconsultoria/domains/workspace.medconsultoria.com.br/public_html
      DEPLOY_SSH_PORT: "1992"
      # Onde `npm` e `node` de verdade moram no CloudLinux. Fora do virtualenv o `npm install`
      # falha com "command not found", o servidor fica com server.js novo e node_modules
      # velho, e o app morre no boot com ERR_MODULE_NOT_FOUND. Derrubou a produção por ~9
      # minutos em 05/08/2026.
      NODE_VENV: ~/nodevenv/domains/workspace.medconsultoria.com.br/public_html/20/bin/activate
      DOMINIO: https://workspace.medconsultoria.com.br

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.19.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.2"
          cache: "pnpm"

      - name: 1/7 · Build de produção + bundle auto-contido
        run: |
          pnpm install --frozen-lockfile
          pnpm build:deploy

      # O artefato só sai daqui se estiver inteiro (ADR-116). Sem `package-lock.json` o `npm ci`
      # do passo 5 falha no servidor — com o `node_modules` JÁ APAGADO. Barrar aqui é barato;
      # descobrir lá é produção parada. E o `npm audit` confirma que o que vai subir está limpo
      # ANTES de subir, não só no PR que originou o commit.
      - name: 1b/7 · O artefato está inteiro e limpo? (lockfile, overrides, audit)
        run: node scripts/conferir-artefato.mjs

      # QUINTA CICATRIZ (17/08/2026, primeira publicação por aqui): os passos 2 e 3 conectaram
      # e o 4 morreu com "connect to host ... port 1992: Connection timed out" — sem sequer
      # abrir a porta. A hospedagem **corta conexões SSH repetidas** vindas de um IP
      # desconhecido, e o runner do GitHub é sempre um IP novo. Uma conexão por passo (o que o
      # deploy.sh fazia, e que no laptop nunca incomodou porque o IP era sempre o mesmo)
      # esbarra nisso na terceira ou quarta.
      #
      # A saída NÃO é voltar a encadear com `&&` — a terceira cicatriz continua valendo: o
      # `prisma generate` derruba a cadeia e o deploy mente que concluiu. A saída é
      # **multiplexação**: uma ÚNICA conexão TCP (`ControlMaster`), reaproveitada por várias
      # sessões independentes. Cada comando segue no seu próprio `ssh`, com o próprio código
      # de saída; o que deixa de se repetir é o aperto de mão na porta.
      - name: 2/7 · Abrir UMA conexão com o servidor e mantê-la
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # O apelido `deploy` carrega host, usuário, porta e chave — os passos seguintes
          # dizem só `ssh deploy`, e o segredo não precisa ser reexportado em cada um.
          cat > ~/.ssh/config <<CFG
          Host deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 15m
            ServerAliveInterval 30
            ServerAliveCountMax 6
            ConnectTimeout 30
          CFG
          chmod 600 ~/.ssh/config

          # Abre o mestre com paciência: se a hospedagem estiver punindo o IP, esperar é o
          # que resolve — insistir rápido é o que prolonga o castigo.
          for TENTATIVA in 1 2 3 4; do
            if ssh -o LogLevel=ERROR -N -f deploy 2>/tmp/ssh-erro; then
              echo "conexão aberta na tentativa $TENTATIVA"
              break
            fi
            echo "tentativa $TENTATIVA falhou: $(cat /tmp/ssh-erro)"
            [ "$TENTATIVA" = "4" ] && { echo "!! não consegui abrir a conexão com o servidor"; exit 1; }
            sleep $((TENTATIVA * 30))
          done
          ssh -O check deploy

      - name: 3/7 · Snapshot do release atual (é o rollback)
        run: |
          set -euo pipefail
          # Um carimbo só, calculado UMA vez: o nome do snapshot precisa bater com o que o
          # ensaio de boot mostra no rollback. Dois `date` dariam segundos diferentes.
          CARIMBO="$(date +%Y%m%d-%H%M%S)"
          echo "CARIMBO=$CARIMBO" >> "$GITHUB_ENV"
          ssh -o LogLevel=ERROR deploy \
            "mkdir -p ~/backups && cd '$DEPLOY_PATH' && \
             tar -czf ~/backups/release-pre-${CARIMBO}.tar.gz --exclude=node_modules . && \
             ls -lh ~/backups/release-pre-${CARIMBO}.tar.gz | awk '{print \$5, \$9}'"

      # `tar | ssh`, e NÃO `rsync`: `rsync --delete` apagaria o `.htaccess` do destino, que
      # não vem no artefato — e é ele que faz o LiteSpeed servir o site. O tar sobrepõe sem
      # apagar. O preço é acumular chunk antigo no destino: ocupa disco, não atrapalha.
      - name: 4/7 · Enviar o artefato
        run: |
          set -euo pipefail
          tar -czf - -C apps/api/dist . | \
            ssh -o LogLevel=ERROR deploy "cd '$DEPLOY_PATH' && tar -xzf - && echo 'artefato extraído'"

      # Cada comando numa SESSÃO SSH PRÓPRIA (pela conexão única do passo 2). Encadeados com
      # `&&`, o `prisma generate` derruba o resto da cadeia: o deploy termina dizendo
      # "concluído" e a aplicação segue rodando o código ANTIGO, sem nunca ter reiniciado.
      - name: 5/7 · Dependências, Prisma Client e migrations
        run: |
          set -euo pipefail
          remoto() { ssh -o LogLevel=ERROR deploy "$@"; }

          # ⛔ NUNCA `comando | tail -N` dentro do `ssh`. O `| tail` roda no shell REMOTO, que
          # não tem `pipefail`: o código que volta é o do `tail`, sempre 0. O `set -euo pipefail`
          # daqui é do runner e não alcança lá dentro. Com `npm install` isso já escondia falha;
          # com `npm ci` fica destrutivo, porque ele APAGA o node_modules antes de instalar — a
          # falha mascarada deixaria o servidor sem node_modules, sem Prisma Client e sem
          # migration, com o deploy seguindo em frente e só o passo 6 reclamando.
          # Achado da revisão adversarial da ADR-116 (18/08/2026).
          #
          # E a rede de segurança: o snapshot do passo 3/7 é `--exclude=node_modules`, então ele
          # NÃO devolve a pasta. Uma cópia por HARDLINK custa ~zero em disco e em tempo, e é o
          # que permite voltar ao estado anterior se o `npm ci` morrer no meio.
          #
          # ⛔ DUAS CORREÇÕES DE 18/08/2026, e a segunda é a que machucou de verdade:
          # (a) a cópia ia para `/tmp`, que na TineHost é OUTRO dispositivo — `cp -al` respondeu
          #     "Invalid cross-device link" e a mensagem impressa foi "sem node_modules previo -
          #     nada a preservar", que era FALSA: a pasta existia. O destino agora fica em `~`,
          #     no mesmo sistema de arquivos do app (é onde os snapshots já moram), e há queda
          #     para cópia real (`cp -a`) se o hardlink falhar por qualquer outro motivo.
          # (b) o socorro fazia `rm -rf node_modules` ANTES de conferir se havia cópia, e o
          #     `|| true` engolia a restauração que não aconteceu. Com a cópia falhando em (a),
          #     um `npm ci` que recusasse o lockfile deixava a produção SEM node_modules — foi
          #     exatamente o que ocorreu às 17:56. Agora: sem cópia conferida, NÃO se apaga nada.
          PRESERVAR="{ cp -al node_modules ~/nm-antes || cp -a node_modules ~/nm-antes ; } && echo 'node_modules preservado'"
          remoto "cd '$DEPLOY_PATH' && rm -rf ~/nm-antes && { $PRESERVAR ; } || echo 'sem node_modules previo - nada a preservar'"

          CI="npm ci --omit=dev > /tmp/npm-ci.log 2>&1"
          SOCORRO="echo '!! npm ci FALHOU'; tail -30 /tmp/npm-ci.log; if [ -d ~/nm-antes ]; then rm -rf node_modules && { cp -al ~/nm-antes node_modules || cp -a ~/nm-antes node_modules ; } && echo '>> node_modules ANTERIOR restaurado - a producao segue na versao velha'; else echo '>> SEM copia de seguranca: node_modules foi DEIXADO como estava, nada foi apagado'; fi; exit 1"
          remoto "cd '$DEPLOY_PATH' && source $NODE_VENV && { $CI ; } || { $SOCORRO ; }"

          GEN="npm run prisma:generate > /tmp/prisma-gen.log 2>&1"
          remoto "cd '$DEPLOY_PATH' && source $NODE_VENV && { $GEN ; } || { echo '!! prisma generate FALHOU'; tail -20 /tmp/prisma-gen.log; exit 1; }"

          DEP="npm run prisma:deploy > /tmp/prisma-dep.log 2>&1"
          remoto "cd '$DEPLOY_PATH' && source $NODE_VENV && { $DEP ; } || { echo '!! migrate deploy FALHOU'; tail -20 /tmp/prisma-dep.log; exit 1; }"

          # Deu certo: mostra o resumo que o `| tail -3` mostrava, agora sem custar o codigo de saida.
          remoto "tail -3 /tmp/npm-ci.log; tail -2 /tmp/prisma-gen.log; tail -3 /tmp/prisma-dep.log"

      # Sobe o app à mão ANTES de reiniciar o de verdade: se faltar dependência ou variável,
      # o erro aparece aqui, com a produção ainda servindo a versão antiga — em vez de virar
      # um 503 para quem está usando o sistema.
      #
      # Sem `head` no cano e sem herdar o código do `grep`: as duas coisas já reprovaram um
      # boot PERFEITO (SIGPIPE do `head`, e `grep` que sai 1 quando não acha erro nenhum).
      # A saída vai inteira para uma variável e só então é avaliada.
      - name: 6/7 · Ensaio de boot (a produção ainda está no ar na versão anterior)
        run: |
          set -uo pipefail
          ENSAIO="$(ssh -o LogLevel=ERROR deploy \
            "cd '$DEPLOY_PATH' && source $NODE_VENV && timeout 25 node app.cjs > /tmp/boot-teste.log 2>&1; \
             grep -c 'Server listening' /tmp/boot-teste.log; echo '--- erros ---'; \
             { grep -iE 'error|invalid' /tmp/boot-teste.log | head -5; } || true" || true)"
          OUVINDO="$(printf '%s\n' "$ENSAIO" | head -1 | tr -dc '0-9')"
          if [ -n "$OUVINDO" ] && [ "$OUVINDO" -gt 0 ]; then
            echo "boot OK ($OUVINDO portas ouvindo) — pode reiniciar"
          else
            echo "!! O app NÃO subiu. A produção continua na versão anterior (nada foi reiniciado)."
            echo "!! Saída do ensaio:"; printf '%s\n' "$ENSAIO"
            echo "!! Rollback do envio: ~/backups/release-pre-${CARIMBO}.tar.gz"
            exit 1
          fi

      - name: 7/7 · Reiniciar e provar que reiniciou
        run: |
          set -euo pipefail
          ssh -o LogLevel=ERROR deploy \
            "cd '$DEPLOY_PATH' && mkdir -p tmp && touch tmp/restart.txt && \
             date -r tmp/restart.txt '+restart.txt marcado em %Y-%m-%d %H:%M:%S'"

      # Sem isto o workflow fica verde com o site fora do ar — e a regra é não anunciar
      # publicação sem resposta HTTP lida. `--compressed` é obrigatório: sem ele o LiteSpeed
      # devolve o corpo comprimido e o teste mostra lixo binário em vez do JSON de saúde.
      - name: Smoke test — o site respondeu de verdade?
        run: |
          set -euo pipefail
          sleep 15
          echo "--- /health ---"
          SAUDE="$(curl -fsS --compressed --max-time 30 "$DOMINIO/health")"
          echo "$SAUDE"
          echo "$SAUDE" | grep -q '"status":"ok"' || { echo "!! /health não disse ok"; exit 1; }
          for ROTA in / /credenciamentos; do
            CODIGO="$(curl -s --compressed -o /dev/null -w '%{http_code}' --max-time 30 "$DOMINIO$ROTA")"
            echo "$ROTA -> $CODIGO"
            [ "$CODIGO" = "200" ] || { echo "!! $ROTA não devolveu 200"; exit 1; }
          done
          echo "NO AR: $DOMINIO"

      - name: Fechar a conexão e limpar a chave do runner
        if: always()
        run: |
          ssh -O exit deploy 2>/dev/null || true
          rm -f ~/.ssh/deploy_key ~/.ssh/config
