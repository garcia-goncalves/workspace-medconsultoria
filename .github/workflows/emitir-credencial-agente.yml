name: Emitir credencial do agente

# Isto NÃO é publicação — não muda uma linha do que roda em produção. É um comando
# administrativo, disparado à mão, que cria/consulta/revoga a credencial com a qual a Cora
# (assistente externa, ADR-149/150) fala com o Workspace em produção. Nunca `on: push`.
#
# ⚠️ ONDE RODA (desde 24/09/2026): na VPS OVH, DENTRO do container `app` que está no ar
# (`docker compose exec -T app ...`). Até a migração rodava na TineHost, por SSH na porta 1992 e
# com o virtualenv do Node — caminho que deixou de ser a produção em 22/09 (o DNS foi para a OVH).
# A imagem já leva `scripts/agente.js` (nasce no `bundle-deploy.mjs`, igual ao `seed.js`), então
# não há nada a instalar: o comando usa o MESMO código e o MESMO `.env` que o app em produção.
#
# ⚠️ POR QUE ISTO PRECISA DE SSH E NÃO RODA "DAQUI": `pnpm agente cliente|delegar|revogar|listar`
# tem uma trava (`podeRodarDemoSeed`, a MESMA do `demo-seed`) que recusa `NODE_ENV=production` e
# recusa banco que não seja localhost — de propósito, para ninguém emitir credencial de produção
# por engano de uma máquina de desenvolvimento. A única forma legítima é rodar o comando DENTRO
# da produção, e é isso que este workflow faz, pela mesma conexão SSH do `deploy-ovh.yml`.
#
# ⚠️ A TRAVA CONTINUA DE PÉ — e aqui ela exige DUAS escotilhas, as duas só PARA ESTA CHAMADA:
#   NODE_ENV=administracao-agente → a do `NODE_ENV` (o processo do app segue `production`);
#   DEMO_SEED_CONFIRMO=1          → a do host: dentro do compose o banco é `mysql`, não
#                                   `localhost`, e sem ela a trava recusaria com razão.
# As duas entram por `docker compose exec -e`, valem só para este processo descartável e morrem
# com ele. Ninguém edita a trava; quem dispara este workflow está escolhendo contorná-la uma vez.
#
# ⚠️ O SEGREDO/TOKEN SÓ APARECE UMA VEZ, no log desta execução — exatamente como no terminal.
# ⛔ ISSO SÓ É SEGURO SE O REPOSITÓRIO FOR PRIVADO — o primeiro passo do job RECUSA rodar se não
# for (não confie neste comentário: é o `if: github.event.repository.private == false` que manda).
# Mesmo privado: copie o valor e feche a aba. Ele NÃO fica em lugar nenhum além do hash que o
# banco guarda.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Digite EMITIR (em maiúsculas) para confirmar"
        required: true
        type: string
      acao:
        description: "O que fazer"
        required: true
        type: choice
        options:
          - listar
          - cliente
          - delegar
          - revogar
        default: listar
      nome:
        description: "[cliente] Nome do AgentClient (ex.: cora-prod)"
        required: false
        type: string
      clientId:
        description: "[delegar] O id do AgentClient (saiu do comando 'cliente')"
        required: false
        type: string
      email:
        description: "[delegar] E-mail da PESSOA em nome de quem a Cora vai falar"
        required: false
        type: string
      minutos:
        description: "[delegar] Prazo da delegação em minutos (máx. 1440 = 24h)"
        required: false
        type: string
        default: "1440"
      escopos:
        description: "[delegar] Escopos, separados por espaço (ex.: tasks:read tasks:write)"
        required: false
        type: string
        default: "tasks:read"
      por:
        description: "[delegar] E-mail de quem está autorizando (fica no registro de auditoria)"
        required: false
        type: string
      delegacao:
        description: "[revogar] O delegationId a revogar"
        required: false
        type: string

concurrency:
  group: credencial-agente-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  emitir:
    if: github.event.inputs.confirmar == 'EMITIR'
    runs-on: ubuntu-latest
    environment: producao
    env:
      # Relativo de propósito, como no deploy-ovh.yml: o ssh já começa na home do VPS_USER.
      ALVO: medconsultoria

    steps:
      # ⛔ TRAVA ESTRUTURAL, NÃO COMENTÁRIO (achado da revisão de segurança, 04/09/2026).
      # Este workflow IMPRIME CREDENCIAL DE PRODUÇÃO NO LOG da execução. Em repositório PÚBLICO,
      # o log do Actions é lido por qualquer pessoa da internet, sem login. Por isso a conferência
      # é feita em código, e para o job inteiro ANTES de gastar uma conexão SSH.
      - name: Recusar rodar em repositório público
        if: github.event.repository.private == false
        run: |
          echo "::error::Este workflow imprime credencial de produção no log da execução, e ESTE REPOSITÓRIO É PÚBLICO — qualquer pessoa da internet leria o token. Torne o repositório privado antes de rodar este workflow. Nada foi executado."
          exit 1

      # Conferência cedo, com mensagem clara. Os inputs entram por variável de ambiente, nunca
      # interpolados dentro da string do `run:` — `${{ inputs.nome }}` cru deixaria injetar
      # comando no RUNNER com um nome do tipo `cora$(curl ... | bash)`.
      - name: Validar os argumentos da ação escolhida
        env:
          ACAO: ${{ inputs.acao }}
          ARG_NOME: ${{ inputs.nome }}
          ARG_CLIENT_ID: ${{ inputs.clientId }}
          ARG_EMAIL: ${{ inputs.email }}
          ARG_DELEGACAO: ${{ inputs.delegacao }}
        run: |
          set -euo pipefail
          case "$ACAO" in
            cliente)
              [ -n "$ARG_NOME" ] || { echo "::error::Ação 'cliente' exige --nome."; exit 1; }
              ;;
            delegar)
              [ -n "$ARG_CLIENT_ID" ] || { echo "::error::Ação 'delegar' exige clientId."; exit 1; }
              [ -n "$ARG_EMAIL" ] || { echo "::error::Ação 'delegar' exige email."; exit 1; }
              ;;
            revogar)
              [ -n "$ARG_DELEGACAO" ] || { echo "::error::Ação 'revogar' exige delegacao (o id)."; exit 1; }
              ;;
            listar) ;;
            *) echo "::error::Ação desconhecida: $ACAO"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - name: Abrir a conexão com o VPS
        uses: ./infra/ovh/acoes/abrir-ssh-vps
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      # O comando roda no container QUE ESTÁ NO AR — sem ele, não há o que emitir contra.
      # `exec` (e não `run`) de propósito: `run` criaria outro container e, sem `--no-deps`,
      # poderia recriar o banco pelo mesmo motivo que o deploy-ovh.yml documenta.
      - name: Conferir que o app está no ar e tem o comando
        run: |
          set -euo pipefail
          ssh vps "cd '$ALVO' && docker compose exec -T app test -f scripts/agente.js" </dev/null \
            || { echo "::error::O container 'app' não está no ar, ou a imagem não tem scripts/agente.js. Confira 'docker compose ps' na VPS (ou publique pelo Deploy OVH) e tente de novo."; exit 1; }

      # Cada argumento entra pela variável de ambiente e é montado com `printf %q` — é o que
      # impede um valor com aspas ou `;` de escapar para outro comando no shell do VPS.
      # ⚠️ `-T` e `</dev/null`: sem TTY (não há terminal no runner) e sem deixar o `exec` comer
      # o stdin do ssh — a armadilha do `docker compose run` registrada em 13/09/2026.
      - name: Rodar o comando dentro do container (escotilhas só para esta chamada)
        env:
          ACAO: ${{ inputs.acao }}
          ARG_NOME: ${{ inputs.nome }}
          ARG_CLIENT_ID: ${{ inputs.clientId }}
          ARG_EMAIL: ${{ inputs.email }}
          ARG_MINUTOS: ${{ inputs.minutos }}
          ARG_ESCOPOS: ${{ inputs.escopos }}
          ARG_POR: ${{ inputs.por }}
          ARG_DELEGACAO: ${{ inputs.delegacao }}
        run: |
          set -euo pipefail

          case "$ACAO" in
            cliente)  ARGS=(cliente --nome "$ARG_NOME") ;;
            delegar)
              ARGS=(delegar --cliente "$ARG_CLIENT_ID" --email "$ARG_EMAIL" --minutos "$ARG_MINUTOS" --escopos "$ARG_ESCOPOS")
              [ -n "$ARG_POR" ] && ARGS+=(--por "$ARG_POR")
              ;;
            revogar)  ARGS=(revogar --delegacao "$ARG_DELEGACAO") ;;
            listar)   ARGS=(listar) ;;
          esac

          COMANDO_REMOTO="cd '$ALVO' && docker compose exec -T -e NODE_ENV=administracao-agente -e DEMO_SEED_CONFIRMO=1 app node scripts/agente.js $(printf '%q ' "${ARGS[@]}")"

          SAIDA="$(ssh -o LogLevel=ERROR vps "$COMANDO_REMOTO" </dev/null 2>&1)" && CODIGO=0 || CODIGO=$?

          # Mascara ANTES de imprimir uma linha sequer — a régua é a saída REAL de
          # `apps/api/src/scripts/agente.ts` ("Bearer valor", com ESPAÇO, não dois-pontos).
          while IFS= read -r LINHA; do
            case "$LINHA" in
              *"x-agent-secret:"*) VALOR="${LINHA##*x-agent-secret: }" ;;
              *"Authorization: Bearer "*) VALOR="${LINHA##*Authorization: Bearer }" ;;
              *) VALOR="" ;;
            esac
            [ -n "$VALOR" ] && echo "::add-mask::$VALOR"
          done <<< "$SAIDA"

          printf '%s\n' "$SAIDA"

          if [ "$CODIGO" -ne 0 ]; then
            echo "::error::O comando terminou com código $CODIGO — nada foi confirmado como emitido."
            exit "$CODIGO"
          fi

      - name: Limpar a chave do runner
        if: always()
        run: rm -f ~/.ssh/vps_key ~/.ssh/config ~/.ssh/known_hosts_vps
