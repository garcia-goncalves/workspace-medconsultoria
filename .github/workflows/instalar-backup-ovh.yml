name: Instalar backup OVH

# Instala (ou reinstala/atualiza) o backup da VPS OVH e PROVA que ele funciona: copia os scripts,
# grava a configuração e a chave, agenda no cron do usuário, roda UM backup e UM ensaio de
# restauração, e mostra o resultado. Disparo manual, digitando INSTALAR. Nunca `on: push`.
#
# O que roda e por quê está em infra/ovh/backup/*.sh; o passo a passo do dono, em
# docs/OPERACAO_OVH.md ("Backup").
#
# SEGREDOS QUE ESTE WORKFLOW EXIGE (além dos cinco do Deploy OVH — VPS_HOST, VPS_USER, VPS_PORT,
# VPS_SSH_KEY, VPS_KNOWN_HOSTS):
#   BACKUP_ENV    o conteúdo inteiro do backup.env preenchido (modelo em
#                 infra/ovh/backup/backup.env.example): bucket, endpoint e chaves de acesso.
#   BACKUP_CHAVE  a chave de cifra (ex.: `openssl rand -base64 48`). ⚠️ GUARDE UMA CÓPIA FORA DO
#                 GITHUB (gerenciador de senhas) ANTES de criar o segredo: segredo do GitHub não
#                 se lê de volta, e sem a chave nenhum backup se decifra — no dia em que a VPS
#                 sumir, é essa cópia que traz os dados de volta.
#
# ⚠️ A CHAVE NUNCA É TROCADA EM SILÊNCIO. Se a VPS já tem uma chave e ela é diferente da do
# segredo, o workflow PARA: trocar a chave tornaria os backups já enviados ilegíveis com a nova,
# e isso é decisão de gente, não de automação.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Digite INSTALAR (em maiúsculas) para instalar o backup e rodar um backup + um ensaio de restauração na VPS"
        required: true
        type: string

# O MESMO grupo do Deploy OVH, de propósito: um dump no meio de uma migração pegaria o banco
# pela metade, e dois processos pesados ao mesmo tempo no disco disputado da VPS é o que se evita.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recusar:
    if: github.event.inputs.confirmar != 'INSTALAR'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "::error::Nada foi feito. Para instalar o backup, digite INSTALAR (em maiúsculas)."
          exit 1

  instalar:
    if: github.event.inputs.confirmar == 'INSTALAR'
    runs-on: ubuntu-latest
    environment: producao
    timeout-minutes: 90
    env:
      ALVO: medconsultoria
    steps:
      # Antes de abrir SSH: os dois segredos novos existem e têm cara de certo? Os valores
      # sensíveis do BACKUP_ENV também são MASCARADOS aqui — os scripts não imprimem segredo, mas a
      # máscara é a segunda tranca, caso algum erro de ferramenta ecoe uma linha de configuração.
      - name: Conferir os segredos do backup
        env:
          BACKUP_ENV: ${{ secrets.BACKUP_ENV }}
          BACKUP_CHAVE: ${{ secrets.BACKUP_CHAVE }}
        run: |
          set -euo pipefail
          [ -n "${BACKUP_ENV:-}" ] || { echo "::error::falta o segredo BACKUP_ENV (gh secret set BACKUP_ENV < backup.env) — modelo em infra/ovh/backup/backup.env.example"; exit 1; }
          [ -n "${BACKUP_CHAVE:-}" ] || { echo "::error::falta o segredo BACKUP_CHAVE — gere com 'openssl rand -base64 48', guarde uma cópia FORA do GitHub, e só então: gh secret set BACKUP_CHAVE"; exit 1; }
          [ "${#BACKUP_CHAVE}" -ge 32 ] || { echo "::error::BACKUP_CHAVE curta demais (${#BACKUP_CHAVE} caracteres; use 'openssl rand -base64 48')"; exit 1; }
          # Máscara só para o que pode ser SENSÍVEL. Mascarar todo valor escondia palavras comuns do
          # log inteiro — `s3`, `Other`, `7`, e `medconsultoria` (o BACKUP_PREFIXO) virariam `***`
          # em qualquer linha de qualquer passo, e o log deixava de servir para diagnosticar.
          # Regra: nome com cara de segredo (SECRET/KEY/SENHA/TOKEN/PASS/PING_URL — a URL do
          # Healthchecks embute o id do check) é sempre mascarado; os nomes sabidamente inofensivos
          # da lista abaixo nunca; qualquer outro nome, se o valor tiver 8+ caracteres.
          INOFENSIVOS=" RCLONE_CONFIG_DESTINO_TYPE RCLONE_CONFIG_DESTINO_PROVIDER RCLONE_CONFIG_DESTINO_REGION BACKUP_PREFIXO MANTER_DIARIOS MANTER_SEMANAIS MANTER_MENSAIS PROJETO_DIR VOLUME_UPLOADS ENSAIO_TMPFS_TAMANHO BANCO "
          while IFS= read -r LINHA; do
            LINHA="${LINHA%$'\r'}"
            case "$LINHA" in ''|'#'*) continue ;; esac
            NOME="${LINHA%%=*}"
            VALOR="${LINHA#*=}"
            [ -n "$VALOR" ] || continue
            if [[ "$NOME" =~ (SECRET|KEY|SENHA|TOKEN|PASS|PING_URL) ]]; then
              echo "::add-mask::$VALOR"
            elif [[ "$INOFENSIVOS" == *" $NOME "* ]]; then
              continue
            elif [ "${#VALOR}" -ge 8 ]; then
              echo "::add-mask::$VALOR"
            fi
          done <<< "$BACKUP_ENV"
          # RCLONE_CONFIG_DESTINO_TYPE é exigido pelo comum.sh na VPS; conferido aqui para falhar
          # cedo, antes de abrir SSH, com a mensagem certa.
          for N in RCLONE_CONFIG_DESTINO_TYPE RCLONE_CONFIG_DESTINO_ENDPOINT RCLONE_CONFIG_DESTINO_ACCESS_KEY_ID RCLONE_CONFIG_DESTINO_SECRET_ACCESS_KEY BACKUP_BUCKET; do
            grep -qE "^$N=.+" <<< "$BACKUP_ENV" || { echo "::error::BACKUP_ENV não tem $N preenchido"; exit 1; }
          done
          echo "segredos do backup presentes"

      - uses: actions/checkout@v4

      - name: Abrir a conexão com o VPS
        uses: ./infra/ovh/acoes/abrir-ssh-vps
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Copiar os scripts para a VPS
        run: |
          set -euo pipefail
          tar -C infra/ovh/backup -cf - backup.sh restore.sh comum.sh instalar-agendamento.sh \
            | ssh vps "mkdir -p '$ALVO/backup' && chmod 700 '$ALVO/backup' && tar -C '$ALVO/backup' -xf - && chmod 700 '$ALVO/backup'/*.sh && ls -l '$ALVO/backup'"

      # Configuração e chave vão pelo STDIN do ssh, nunca pela linha de comando (que fica no
      # `ps` de quem mais estiver na máquina compartilhada), e nascem com umask 077 (600).
      - name: Gravar configuração e chave (a chave nunca é sobrescrita se for diferente)
        env:
          BACKUP_ENV: ${{ secrets.BACKUP_ENV }}
          BACKUP_CHAVE: ${{ secrets.BACKUP_CHAVE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BACKUP_ENV" | ssh vps 'umask 077; mkdir -p ~/.config/medconsultoria-backup && chmod 700 ~/.config/medconsultoria-backup && cat > ~/.config/medconsultoria-backup/backup.env'
          # A comparação ignora quebra de linha no fim (o segredo pode ter sido criado com ou sem
          # ela) — os dois lados são normalizados por `$(...)`, que remove as finais.
          # ⚠️ Chave de UMA linha: o `openssl -pass file:` lê só a primeira. `openssl rand -base64 48`
          # dá exatamente 64 caracteres numa linha; valores maiores quebram em duas.
          CHAVE="$(printf '%s' "$BACKUP_CHAVE")"
          case "$CHAVE" in *$'\n'*) echo "::error::BACKUP_CHAVE tem mais de uma linha — o openssl leria só a primeira. Gere com 'openssl rand -base64 48'."; exit 1 ;; esac
          HASH_LOCAL="$(printf '%s\n' "$CHAVE" | sha256sum | cut -d' ' -f1)"
          HASH_REMOTO="$(ssh vps 'if [ -f ~/.config/medconsultoria-backup/chave ]; then printf "%s\n" "$(cat ~/.config/medconsultoria-backup/chave)" | sha256sum | cut -d" " -f1; fi')"
          if [ -z "$HASH_REMOTO" ]; then
            printf '%s\n' "$CHAVE" | ssh vps 'umask 077; cat > ~/.config/medconsultoria-backup/chave'
            echo "chave instalada (primeira vez)"
          elif [ "$HASH_REMOTO" = "$HASH_LOCAL" ]; then
            echo "chave já instalada e igual à do segredo"
          else
            echo "::error::A VPS já tem uma chave de cifra DIFERENTE da do segredo BACKUP_CHAVE. Trocar tornaria os backups já enviados ilegíveis com a chave nova. Nada foi alterado. Se a troca é intencional, siga 'Trocar a chave do backup' em docs/OPERACAO_OVH.md."
            exit 1
          fi

      - name: Agendar (cron do usuário)
        run: ssh vps "bash '$ALVO/backup/instalar-agendamento.sh'" </dev/null

      # A prova. Sem ela, "instalado" quer dizer só "os arquivos estão lá".
      - name: Rodar um backup agora
        run: ssh vps "bash '$ALVO/backup/backup.sh'" </dev/null

      - name: Rodar um ensaio de restauração agora (MySQL descartável, sem tocar na produção)
        run: ssh vps "bash '$ALVO/backup/restore.sh'" </dev/null

      - name: Limpar a chave do runner
        if: always()
        run: rm -f ~/.ssh/vps_key ~/.ssh/config ~/.ssh/known_hosts_vps
