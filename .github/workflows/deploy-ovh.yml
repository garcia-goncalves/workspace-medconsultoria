name: Deploy OVH

# A esteira do VPS (ADR-154). Publicar NÃO é automático: o gatilho é o botão "Run workflow".
#
# O QUE MUDOU EM RELAÇÃO AO `deploy.yml` DA TINEHOST: o servidor deixou de montar o ambiente.
# Aqui a imagem é construída no runner, publicada no GHCR, e o servidor só faz `pull`, `migrate`
# e `up -d`. O `npm ci` em produção — que travou duas vezes em 12/09/2026, 2h15 e 38 min, sem uma
# linha de log — não existe mais.
#
# `confirmar` aceita:
#   SO_IMAGEM  → constrói e publica a imagem, e PARA. Não toca no servidor.
#   PUBLICAR   → constrói, publica e sobe no VPS.
#
# PUBLICAR exige CINCO segredos no repositório — `SO_IMAGEM` não exige nenhum:
#   VPS_HOST · VPS_USER · VPS_PORT · VPS_SSH_KEY · VPS_KNOWN_HOSTS (desde 24/09/2026)
# ⚠️ Os três primeiros são dados de acesso e por isso NÃO estão escritos em lugar nenhum do
# repositório, que é público (ADR-154). `VPS_PORT` existe como segredo separado justamente
# porque a porta deste VPS não é a 22.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "PUBLICAR (sobe no VPS) ou SO_IMAGEM (só constrói a imagem)"
        required: true
        type: choice
        options: [SO_IMAGEM, PUBLICAR]

# Dois deploys ao mesmo tempo disputam o mesmo banco e a mesma troca de container. O segundo
# espera o primeiro — a armadilha mais cara do projeto, resolvida de graça aqui.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  # A suíte COMPLETA no commit EXATO que vai ao ar. Nada toca o servidor antes dela fechar verde.
  suite:
    uses: ./.github/workflows/ci.yml

  imagem:
    needs: suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ env.IMAGEM }}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A imagem leva DUAS etiquetas: a do commit (é ela que o servidor sobe, e é ela que permite
      # voltar para a anterior com um `up -d`) e `main`, para quem quiser a mais recente.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.tag }},${{ env.IMAGEM }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publicar:
    if: github.event.inputs.confirmar == 'PUBLICAR'
    needs: imagem
    runs-on: ubuntu-latest
    environment: producao
    # O pacote no GHCR nasce PRIVADO, mesmo vindo de repositório público. Sem esta permissão o
    # `docker login` do passo 3 recebe um token que não lê pacote, e o `pull` falha com "denied".
    permissions:
      contents: read
      packages: read
    env:
      # Onde o projeto mora de verdade na VPS compartilhada (conferido em 18/09/2026). Relativo de
      # propósito: o ssh já começa na home, e `~` entre as aspas simples do `cd` não se expande.
      ALVO: medconsultoria
    steps:
      # Só para a ação local de SSH abaixo existir no runner — nada do código vai para o VPS.
      - uses: actions/checkout@v4

      # ⚠️ O SSH deste VPS NÃO é na porta 22, e a chave do servidor é CONFERIDA contra o segredo
      # `VPS_KNOWN_HOSTS` (antes era `accept-new`, que no runner efêmero não verificava nada).
      # A ação diz exatamente qual segredo falta, se faltar.
      - name: 1/5 · Abrir a conexão com o VPS
        uses: ./infra/ovh/acoes/abrir-ssh-vps
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      # A tag do commit entra no .env do servidor. É isso que torna o rollback um `up -d`:
      # trocar a linha para a tag anterior e subir de novo.
      #
      # ⚠️ A imagem ANTERIOR é lida ANTES da troca e guardada em dois lugares: no ambiente do
      # runner (é o que o passo "Voltar para a imagem anterior" usa) e em `.env.antes-do-deploy`
      # no servidor (para quem precisar voltar à mão depois que este run acabou). Sem isso, o
      # único registro da versão boa seria o `.env` — justamente o arquivo que este passo apaga.
      - name: 2/5 · Apontar o .env para a imagem deste commit
        id: troca
        run: |
          set -euo pipefail
          ANTERIOR="$(ssh vps "cd '$ALVO' && grep '^APP_IMAGE=' .env | cut -d= -f2-" || true)"
          if [ -n "$ANTERIOR" ]; then
            echo "imagem anterior: $ANTERIOR"
            echo "APP_IMAGE_ANTERIOR=$ANTERIOR" >> "$GITHUB_ENV"
          else
            echo "::warning::o .env não tinha APP_IMAGE — se este deploy falhar, NÃO há volta automática."
          fi
          ssh vps "cd '$ALVO' && cp -p .env .env.antes-do-deploy && sed -i 's|^APP_IMAGE=.*|APP_IMAGE=${{ needs.imagem.outputs.tag }}|' .env && grep '^APP_IMAGE=' .env"

      # O VPS não guarda credencial do GHCR de propósito (é máquina compartilhada com outros
      # projetos do dono). Ele recebe o token EFÊMERO deste run, por stdin — nunca na linha de
      # comando, que fica no histórico e no `ps` de quem mais estiver na máquina —, baixa a
      # imagem, e o `docker logout` do fim devolve a máquina ao estado anterior.
      - name: 3/5 · Baixar a imagem
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh vps "cd '$ALVO' && docker compose pull app"

      # Passo PRÓPRIO, antes de o tráfego trocar — e em container descartável. Encadear isto com
      # o resto foi o que, na esteira antiga, deixava o deploy dizer "concluído" com a migration
      # falhada e o app servindo o código anterior.
      #
      # ⚠️ `--no-deps` NÃO é detalhe: sem ele este passo RECRIA O BANCO DE PRODUÇÃO a cada deploy.
      # Os dois serviços do compose declaram `env_file: .env`, e o passo 3/5 logo acima SEMPRE
      # altera o `.env` (é ele que aponta a imagem nova). Isso muda o hash de configuração do
      # serviço `mysql` junto, e o `compose run` — que sobe as dependências — decide recriá-lo.
      # Visto em 21/09/2026: o comando ficou 4 minutos pendurado em "Container …mysql-1 Recreate"
      # e não migrou nada. Com o disco saturado o container nem nasce; com o disco livre ele
      # nasce, e aí o banco reinicia no meio da publicação sem ninguém ter pedido.
      # ⚠️ `--no-deps` PRESSUPÕE o `mysql` no ar — e é assim que se quer: num deploy o banco já
      # está servindo, e se não estiver o erro é de conexão, alto e claro, em vez de um restart
      # silencioso do banco.
      # ⚠️ NASCEU DO INCIDENTE DE 22/09/2026. O passo 5/5 subia com `docker compose up -d` SEM
      # `--no-deps` e recriou o `mysql` no meio da publicação: parou o banco, falhou ao criar o
      # substituto ("name is already in use") e deixou a homologação respondendo HTML com o
      # banco FORA — e o `/health` dizendo "ok", porque ele NÃO toca o banco.
      #
      # ⚠️ `docker start` pelo NOME, nunca `docker compose start mysql`: o compose pode resolver
      # o serviço para o container meio-criado que a recriação falhada deixou para trás.
      # ⚠️ Iniciar NÃO é recriar — o volume de dados não é tocado.
      # ⚠️ Esperar o banco ACEITAR CONEXÃO antes de migrar: container "Up" não é banco pronto,
      # e o 4/5 morreria em "can't reach database server" por alguns segundos de diferença.
      - name: 3b/5 · Garantir o banco no ar (sem recriá-lo)
        run: |
          set -euo pipefail
          ssh vps 'docker ps -q -f name="^medconsultoria-mysql-1$" | grep -q . && echo "banco já no ar" || { echo "banco parado — iniciando o container existente"; docker start medconsultoria-mysql-1; }'
          # ⚠️ `Access denied` CONTA COMO VIVO, e não é gambiarra: o servidor só responde isso
          # depois de aceitar a conexão e processar o desafio de autenticação — é prova de que a
          # porta está servindo. Sem a senha (que não deve viajar por aqui), `mysqladmin ping`
          # sai com código de erro mesmo com o banco perfeito, e a espera nunca terminaria.
          ssh vps 'for i in $(seq 1 30); do if docker exec medconsultoria-mysql-1 mysqladmin ping 2>&1 | grep -qE "mysqld is alive|Access denied"; then echo "banco respondendo (tentativa $i)"; exit 0; fi; sleep 2; done; echo "!! o banco nao respondeu em 60s"; exit 1'

      # O órfão de uma recriação falhada fica em estado `created` com o nome prefixado pelo id
      # antigo — e é ele que sequestra o nome no deploy seguinte. Só remove o que NUNCA rodou.
      - name: 3c/5 · Limpar órfão de recriação anterior
        run: |
          set -euo pipefail
          ssh vps 'for C in $(docker ps -aq -f status=created -f name=_medconsultoria-mysql-1); do echo "removendo orfao $C"; docker rm "$C" || true; done; echo ok'

      - name: 4/5 · Migrations
        run: ssh vps "cd '$ALVO' && docker compose run --rm --no-deps app npm run prisma:deploy"

      # O `up -d` respeita o healthcheck da imagem: container que não responde /health não recebe
      # tráfego. É o ensaio de boot de antes, agora contínuo.
      - name: 5/5 · Subir e provar que subiu
        run: |
          set -euo pipefail
          # ⚠️ `--no-deps` TAMBÉM AQUI, pelo mesmo motivo do 4/5: o `mysql` declara
          # `env_file: .env` e o passo 2/5 SEMPRE altera o `.env`. Sem isto o `up -d` recria o
          # banco a cada publicação. O PR #215 pôs `--no-deps` na migração e deixou ESTE de
          # fora — foi exatamente aqui que a homologação caiu em 22/09/2026.
          ssh vps "cd '$ALVO' && docker compose up -d --no-deps app"
          ssh vps "cd '$ALVO' && docker compose ps"

      # Sem isto o workflow fica verde com o site fora do ar — a regra que não muda de hospedagem:
      # não se anuncia publicação sem resposta HTTP lida.
      #
      # ⚠️ `/health/pronto`, não `/health`: o segundo NÃO toca o banco, e foi assim que a
      # homologação passou por "ok" com o MySQL fora em 22/09/2026. O primeiro faz `SELECT 1`.
      # ⚠️ Espera em laço (até ~2 min) em vez de `sleep` fixo: o app leva uns 20–40 s para subir,
      # e na VPS de disco disputado pode levar mais — um `sleep 20` reprovava deploy bom.
      - name: Smoke test — o site respondeu de verdade (banco incluído)?
        run: |
          set -euo pipefail
          DOMINIO="$(ssh vps "cd '$ALVO' && grep '^DOMINIO=' .env | cut -d= -f2")"
          PRONTO=""
          for i in $(seq 1 24); do
            if SAUDE="$(curl -fsS --compressed --max-time 10 "https://$DOMINIO/health/pronto")" \
               && echo "$SAUDE" | grep -q '"status":"pronto"'; then
              PRONTO=1; echo "tentativa $i: $SAUDE"; break
            fi
            echo "tentativa $i: ainda não pronto"; sleep 5
          done
          [ -n "$PRONTO" ] || { echo "::error::/health/pronto não respondeu 'pronto' em ~2 min"; exit 1; }
          for ROTA in / /credenciamentos; do
            CODIGO="$(curl -s --compressed -o /dev/null -w '%{http_code}' --max-time 30 "https://$DOMINIO$ROTA")"
            echo "$ROTA -> $CODIGO"
            [ "$CODIGO" = "200" ] || { echo "::error::$ROTA não devolveu 200"; exit 1; }
          done
          echo "NO AR: https://$DOMINIO"

      # A VOLTA AUTOMÁTICA. Roda só se algo falhou DEPOIS que o `.env` foi trocado (o passo
      # `troca` deu certo) e havia imagem anterior para onde voltar.
      #
      # ⚠️ `--no-deps`, sempre — pelo mesmo motivo dos passos 4/5 e 5/5: sem ele o `up -d`
      # recriaria o banco, e numa hora em que já há algo errado.
      # ⚠️ Se a falha foi na MIGRAÇÃO, o app nem chegou a trocar: voltar a linha do `.env` deixa
      # a configuração do `app` igual à do container no ar, e o `up -d` não faz nada — seguro.
      # ⚠️ A volta NÃO desfaz migração já aplicada. É por isso que migração aqui é ADITIVA
      # (coluna/tabela nova): a imagem anterior roda sobre o banco novo. Migração que apague ou
      # renomeie coluna precisa de plano próprio antes de publicar.
      # ⚠️ Termina VERMELHO de propósito, mesmo quando a volta dá certo: a publicação falhou, e o
      # que está no ar é a versão anterior — ninguém pode ler "verde" aqui.
      - name: Voltar para a imagem anterior (a publicação falhou)
        if: failure() && steps.troca.outcome == 'success' && env.APP_IMAGE_ANTERIOR != ''
        run: |
          set -euo pipefail
          echo "voltando APP_IMAGE para $APP_IMAGE_ANTERIOR"
          ssh vps "cd '$ALVO' && sed -i 's|^APP_IMAGE=.*|APP_IMAGE=$APP_IMAGE_ANTERIOR|' .env && grep '^APP_IMAGE=' .env"
          ssh vps "cd '$ALVO' && docker compose up -d --no-deps app"
          DOMINIO="$(ssh vps "cd '$ALVO' && grep '^DOMINIO=' .env | cut -d= -f2")"
          for _ in $(seq 1 24); do
            if curl -fsS --max-time 10 "https://$DOMINIO/health/pronto" | grep -q '"status":"pronto"'; then
              echo "::error::A PUBLICAÇÃO FALHOU e o site VOLTOU para a imagem anterior ($APP_IMAGE_ANTERIOR), que respondeu 'pronto'. Veja o passo que falhou acima."
              exit 1
            fi
            sleep 5
          done
          echo "::error::A PUBLICAÇÃO FALHOU, a volta para $APP_IMAGE_ANTERIOR foi aplicada, mas /health/pronto NÃO respondeu depois dela. O site pode estar FORA — olhe 'docker compose ps' e 'docker compose logs app' na VPS agora."
          exit 1

      - name: Limpar a chave do runner e a credencial deixada no VPS
        if: always()
        run: |
          ssh vps "docker logout ghcr.io" || true
          rm -f ~/.ssh/vps_key ~/.ssh/config ~/.ssh/known_hosts_vps
