name: Diagnóstico do servidor

# Só leitura, de propósito: nada aqui apaga, move, pausa ou reinicia coisa nenhuma em produção.
#
# DOIS ALVOS, escolhidos no botão:
#   OVH      — a produção desde 22/09/2026 (VPS compartilhada, Docker). É o padrão.
#   TINEHOST — o servidor antigo, mantido ligado como rede de segurança do rollback (ADR-154,
#              ao menos 14 dias). Nasceu em 17/09/2026 para investigar o passo "3/7 · Snapshot"
#              do deploy.yml, que falhava em ~40 s com o SSH devolvendo 255.
#
# ⚠️ O QUE ESTE WORKFLOW NUNCA IMPRIME, e por quê: `.env` (senhas e chaves de cifra do paciente),
# `docker inspect` (mostra TODO o ambiente do container, segredos inclusive) e `docker logs` do
# app (tRPC loga entrada de erro, e na Conciliação isso pode ser nome de paciente). O log do
# Actions fica guardado e é lido por quem tem acesso ao repositório — não é lugar de dado pessoal.
#
# ⚠️ A PERGUNTA QUE ELE EXISTE PARA RESPONDER NA OVH é a lição de 21/09/2026: a VPS é
# compartilhada, e um vizinho escrevendo no disco sem parar deixou `iowait` em 48–60% e carga 186
# com a CPU a 1% — nenhum container nascia. Antes de culpar a imagem, olhe carga, iowait e quem
# está escrevendo. É o que as seções abaixo mostram.

on:
  workflow_dispatch:
    inputs:
      servidor:
        description: "Qual servidor diagnosticar"
        required: true
        type: choice
        options: [OVH, TINEHOST]
        default: OVH

permissions:
  contents: read

jobs:
  ovh:
    if: github.event.inputs.servidor == 'OVH'
    runs-on: ubuntu-latest
    environment: producao
    env:
      ALVO: medconsultoria
    steps:
      - uses: actions/checkout@v4

      - name: Abrir a conexão com o VPS
        uses: ./infra/ovh/acoes/abrir-ssh-vps
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      # Cada bloco com `|| true`: diagnóstico que para no primeiro comando indisponível esconde
      # justamente o resto do retrato. `timeout` em tudo que fala com o Docker — com o disco
      # saturado o `docker` pendura, e um diagnóstico pendurado não diagnostica nada.
      # ⚠️ O script viaja pelo stdin do `bash -s`, então todo comando `docker` lá dentro leva
      # `</dev/null`: um que lesse o stdin comeria o RESTO do script (a armadilha de 13/09/2026).
      - name: Carga, disco e quem está pesando na máquina
        run: |
          set -uo pipefail
          ssh -o LogLevel=ERROR vps 'bash -s' <<'REMOTO'
          echo "--- carga e tempo no ar ---"; uptime || true
          echo; echo "--- CPU e iowait (3 amostras de 1 s; coluna wa = iowait) ---"; vmstat 1 3 || true
          echo; echo "--- pressão de disco (PSI: 'some avg10' alto = processos esperando disco) ---"
          cat /proc/pressure/io 2>/dev/null || echo "PSI indisponível"
          echo; echo "--- memória ---"; free -h || true
          echo; echo "--- espaço em disco ---"; df -h / /var/lib/docker 2>/dev/null || df -h / || true
          echo; echo "--- uso do Docker (imagens, containers, volumes, cache) ---"
          timeout 30 docker system df </dev/null 2>&1 || echo "docker system df não respondeu em 30 s — sinal de disco saturado"
          echo; echo "--- containers da máquina inteira (nome, estado, imagem) ---"
          timeout 30 docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' </dev/null 2>&1 || echo "docker ps não respondeu em 30 s"
          echo; echo "--- consumo por container (CPU, memória, disco lido/escrito) ---"
          timeout 45 docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.BlockIO}}' </dev/null 2>&1 || echo "docker stats não respondeu em 45 s"
          echo; echo "--- o Docker ainda cria container? (a prova de 21/09: se isto estoura, o problema é a máquina, não a imagem) ---"
          if timeout 45 docker run --rm alpine:3 echo "alpine ok" </dev/null 2>&1; then :; else echo "!! docker run alpine NÃO completou em 45 s"; fi
          REMOTO

      - name: O Workspace especificamente
        run: |
          set -uo pipefail
          ssh -o LogLevel=ERROR vps "ALVO='$ALVO' bash -s" <<'REMOTO'
          cd "$ALVO" || { echo "pasta $ALVO não existe"; exit 0; }
          echo "--- serviços do compose ---"; timeout 30 docker compose ps </dev/null 2>&1 || true
          echo; echo "--- imagem apontada no .env (só a linha APP_IMAGE, nada mais do arquivo) ---"
          grep '^APP_IMAGE=' .env 2>/dev/null || echo "sem APP_IMAGE no .env"
          echo; echo "--- prontidão vista de dentro da máquina (sem nginx no meio) ---"
          echo -n "/health        -> "; curl -s -o /dev/null -w '%{http_code}\n' --max-time 10 http://127.0.0.1:4319/health || echo "sem resposta"
          echo -n "/health/pronto -> "; curl -s --max-time 10 http://127.0.0.1:4319/health/pronto || echo "sem resposta"; echo
          echo; echo "--- volumes do projeto (tamanho) ---"
          for V in medconsultoria_mysql_dados medconsultoria_uploads; do
            M="$(timeout 20 docker volume inspect -f '{{.Mountpoint}}' "$V" </dev/null 2>/dev/null)" || { echo "$V: não encontrado"; continue; }
            echo "$V: $(timeout 60 du -sh "$M" 2>/dev/null | cut -f1 || echo 'sem permissão para medir')"
          done
          echo; echo "--- backup: o último registro (backup/ultimo.log), se o backup já foi instalado ---"
          if [ -f backup/ultimo.log ]; then tail -n 15 backup/ultimo.log; else echo "backup não instalado (ver docs/OPERACAO_OVH.md)"; fi
          REMOTO

      - name: Limpar a chave do runner
        if: always()
        run: rm -f ~/.ssh/vps_key ~/.ssh/config ~/.ssh/known_hosts_vps

  tinehost:
    if: github.event.inputs.servidor == 'TINEHOST'
    runs-on: ubuntu-latest
    environment: producao
    permissions: {}
    env:
      DEPLOY_PATH: /home3/medconsultoria/domains/workspace.medconsultoria.com.br/public_html
      DEPLOY_SSH_PORT: "1992"
    steps:
      - name: Abrir conexão
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          # ⚠️ `accept-new` continua AQUI, e só aqui: a TineHost é o servidor antigo, sem segredo
          # de known_hosts, a caminho de ser desligado. Os workflows da OVH conferem a chave.
          cat > ~/.ssh/config <<CFG
          Host deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 6
            ConnectTimeout 30
          CFG
          chmod 600 ~/.ssh/config

      - name: Espaço em disco, backups acumulados e processos pendurados
        run: |
          set -euo pipefail
          ssh -o LogLevel=ERROR deploy "
            echo '--- espaço em disco (quota da conta) ---'
            df -h ~ 2>/dev/null || echo 'df não disponível nesta hospedagem'
            echo
            echo '--- backups acumulados em ~/backups (contagem + tamanho, sem nomes) ---'
            if [ -d ~/backups ]; then
              echo \"\$(ls ~/backups 2>/dev/null | wc -l) arquivo(s)\"
              du -sh ~/backups 2>/dev/null || true
            else
              echo 'pasta não existe'
            fi
            echo
            echo '--- sobrou node_modules preservado de deploy cancelado? ---'
            du -sh ~/nm-antes 2>/dev/null || echo 'não existe (bom sinal)'
            echo
            echo '--- tamanho do app publicado ---'
            du -sh '$DEPLOY_PATH' 2>/dev/null || true
            echo
            echo '--- processos node/npm pendurados (só o binário, sem argumentos) ---'
            ps -u \$(whoami) -o pid,etime,comm 2>/dev/null | grep -iE 'node|npm' | grep -v grep || echo 'nenhum'
            echo
            echo '--- quota (se existir o comando) ---'
            quota -s 2>/dev/null || echo 'comando quota indisponível'
          "

      - name: Limpar a chave do runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
