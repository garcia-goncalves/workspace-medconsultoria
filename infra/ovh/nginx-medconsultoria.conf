# HOMOLOGAÇÃO (homolog.workspace.medconsultoria.com.br) — ADR-154. O site de PRODUÇÃO é outro
# arquivo: `nginx-producao.conf`. ⚠️ Este é o estado ANTES do certbot: no servidor, o
# `certbot --nginx` acrescentou o bloco 443 e o redirecionamento — o arquivo real tem mais linhas.
#
# MedConsultoria (ADR-154) — publicado pelo nginx do HOST, app em 127.0.0.1:4319.
#
# Instalar (exige sudo):
#   sudo cp nginx-medconsultoria.conf /etc/nginx/sites-available/medconsultoria
#   sudo ln -s /etc/nginx/sites-available/medconsultoria /etc/nginx/sites-enabled/medconsultoria
#   sudo nginx -t          ← ANTES do reload: um erro aqui derruba os outros sites da máquina junto
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d <dominio>     ← só depois que o DNS do domínio aponta para a VPS
server {
    listen 80;
    listen [::]:80;
    server_name homolog.workspace.medconsultoria.com.br;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:4319;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # O app confia em loopback/rede privada (ADR-146) e lê o visitante À DIREITA do
        # X-Forwarded-For — que é onde o $proxy_add_x_forwarded_for anexa o IP real. Nunca
        # repassar um cabeçalho escolhido pelo cliente: é a chave dos freios e a prova gravada
        # em Assinatura.ip.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
