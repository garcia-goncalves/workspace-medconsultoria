# ⚠️⚠️ ESPELHO, NÃO FONTE: este arquivo reproduz o site de PRODUÇÃO que está no nginx do HOST da
# VPS OVH (workspace.medconsultoria.com.br + www), escrito em 24/09/2026 SEM acesso ao servidor.
# O certbot EDITA o arquivo real ao emitir/renovar o certificado, então o que está lá pode ter
# linhas que este não tem. ANTES de aplicar qualquer coisa daqui, compare:
#
#   sudo cat /etc/nginx/sites-available/<nome-do-site>      ← o nome real: `ls /etc/nginx/sites-enabled/`
#   diff <(sudo cat /etc/nginx/sites-available/<nome>) infra/ovh/nginx-producao.conf
#
# e traga para cá o que o servidor tiver de diferente (é este arquivo que tem de virar o retrato
# fiel do servidor, não o contrário). Nunca copie por cima sem o diff.
#
# Aplicar, SE for aplicar (exige sudo; a máquina é compartilhada — um erro derruba os vizinhos):
#   sudo cp /etc/nginx/sites-available/<nome> ~/nginx-<nome>.antes     ← cópia para voltar
#   sudo cp nginx-producao.conf /etc/nginx/sites-available/<nome>
#   sudo nginx -t          ← SEMPRE antes do reload
#   sudo systemctl reload nginx
#
# O site de homologação (homolog.workspace...) é outro arquivo: `nginx-medconsultoria.conf`.
# Os dois falam com o MESMO app em 127.0.0.1:4319.

# ── 80 → 443 ─────────────────────────────────────────────────────────────────────────────────
# Tudo em HTTP vira HTTPS — exceto o desafio do Let's Encrypt. Com o plugin `--nginx` (o que foi
# usado aqui) o certbot injeta a própria rota na hora da renovação; o `location` abaixo só pesa
# se um dia a renovação passar a ser por `--webroot /var/www/html`. Mantido porque, se o
# redirecionamento engolisse o desafio, a renovação de 90 em 90 dias falharia em silêncio e o
# site cairia no dia em que o certificado vencesse. Confira o que o certbot usa com
# `sudo cat /etc/letsencrypt/renewal/workspace.medconsultoria.com.br.conf` (linha authenticator).
server {
    listen 80;
    listen [::]:80;
    server_name workspace.medconsultoria.com.br www.workspace.medconsultoria.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://workspace.medconsultoria.com.br$request_uri;
    }
}

# ── www → sem www ────────────────────────────────────────────────────────────────────────────
# Um endereço só. O cookie de sessão é emitido para o host exato; com dois hosts a pessoa
# "perde o login" ao trocar de um para o outro, e o WEB_ORIGIN do app é o sem www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.workspace.medconsultoria.com.br;

    ssl_certificate /etc/letsencrypt/live/workspace.medconsultoria.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/workspace.medconsultoria.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://workspace.medconsultoria.com.br$request_uri;
}

# ── o site ───────────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # ⚠️ `http2 on;` é a sintaxe do nginx >= 1.25.1. Em versão anterior, troque por
    # `listen 443 ssl http2;` e apague esta linha — `nginx -t` diz qual é o caso.
    http2 on;
    server_name workspace.medconsultoria.com.br;

    ssl_certificate /etc/letsencrypt/live/workspace.medconsultoria.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/workspace.medconsultoria.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # O upload do app aceita até 20 MB por arquivo (`TAMANHO_MAX`, apps/api/src/lib/storage.ts),
    # e o corpo multipart leva cabeçalhos e bordas por cima. 25 MB dá folga sem abrir a porta
    # para corpo arbitrário — o limite de verdade continua sendo o do app, que responde 413 em
    # português. Com o padrão do nginx (1 MB) o upload morreria aqui com uma página em inglês.
    client_max_body_size 25m;

    # Não anunciar a versão do nginx em página de erro.
    server_tokens off;

    # ⚠️ OS CABEÇALHOS DE SEGURANÇA (CSP, HSTS, X-Content-Type-Options, frame-ancestors...) NÃO
    # são postos aqui DE PROPÓSITO: quem os emite é o próprio app, pelo `@fastify/helmet`
    # (ADR-135 — o painel SISTEMA → Manutenção lê do boot se a CSP está ligada). Repeti-los no
    # nginx criaria cabeçalho DUPLICADO, e uma CSP duplicada vale a interseção das duas: a
    # primeira mudança no app que dependesse de uma diretiva nova quebraria a tela sem ninguém
    # entender por quê.

    location / {
        proxy_pass http://127.0.0.1:4319;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # O app confia em loopback/rede privada (ADR-146, `PROXY_CONFIAVEL`) e lê o visitante À
        # DIREITA do X-Forwarded-For — que é onde o $proxy_add_x_forwarded_for anexa o IP real.
        # Nunca repassar um cabeçalho escolhido pelo cliente: é a chave dos freios de tentativa e
        # a prova gravada em Assinatura.ip.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 120 s: a IA (Gemini) pode levar ~30 s, a importação de planilha da Conciliação mais.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
